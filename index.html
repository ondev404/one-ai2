<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>oneAi — AI Assistant</title>

<meta name="theme-color" content="#0b0b0f">
<meta name="description" content="oneAi - AI Assistant by ONEDEV">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#0b0b0f;
    --bg2:#111116;
    --panel:#15151b;
    --panel2:#1b1b22;
    --border:rgba(255,255,255,.08);
    --text:#f5f5f5;
    --muted:#92929d;
    --accent:#ffffff;
    --accentText:#080808;
    --hover:rgba(255,255,255,.07);
    --danger:#ef4444;
    --shadow:0 20px 60px rgba(0,0,0,.35);
}

body.light{
    --bg:#f7f7f8;
    --bg2:#ffffff;
    --panel:#ffffff;
    --panel2:#f1f1f3;
    --border:rgba(0,0,0,.09);
    --text:#161616;
    --muted:#707070;
    --accent:#111111;
    --accentText:#ffffff;
    --hover:rgba(0,0,0,.06);
    --shadow:0 20px 60px rgba(0,0,0,.12);
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:var(--bg);
    color:var(--text);
    transition:
        background .25s ease,
        color .25s ease;
}

/* =========================
   SVG ICON
========================= */

svg{
    width:20px;
    height:20px;
    display:block;
    stroke:currentColor;
}

.icon{
    width:20px;
    height:20px;
}

/* =========================
   APP
========================= */

.app{
    width:100%;
    height:100dvh;
    display:flex;
    position:relative;
    overflow:hidden;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:280px;
    height:100%;
    background:var(--bg2);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    transition:
        width .25s ease,
        transform .25s ease,
        background .25s ease;
    z-index:50;
}

.sidebar-top{
    padding:16px;
}

.new-chat{
    width:100%;
    height:46px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    transition:.2s;
}

.new-chat:hover{
    background:var(--hover);
    transform:translateY(-1px);
}

.sidebar-title{
    padding:10px 18px 8px;
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-weight:700;
}

.history{
    flex:1;
    overflow-y:auto;
    padding:0 10px 10px;
}

.history::-webkit-scrollbar{
    width:5px;
}

.history::-webkit-scrollbar-thumb{
    background:var(--border);
    border-radius:10px;
}

.history-empty{
    color:var(--muted);
    text-align:center;
    padding:30px 15px;
    font-size:13px;
    line-height:1.6;
}

.history-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 12px;
    margin-bottom:3px;
    border-radius:10px;
    cursor:pointer;
    color:var(--text);
    transition:.18s;
    position:relative;
}

.history-item:hover{
    background:var(--hover);
}

.history-item.active{
    background:var(--hover);
}

.history-icon{
    color:var(--muted);
    flex-shrink:0;
}

.history-name{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:13px;
}

.history-delete{
    width:27px;
    height:27px;
    border:0;
    background:transparent;
    color:var(--muted);
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    opacity:0;
}

.history-item:hover .history-delete{
    opacity:1;
}

.history-delete:hover{
    background:rgba(239,68,68,.12);
    color:var(--danger);
}

.sidebar-bottom{
    padding:12px;
    border-top:1px solid var(--border);
}

.profile{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px;
}

.profile-logo{
    width:36px;
    height:36px;
    border-radius:10px;
    object-fit:cover;
    background:var(--panel);
}

.profile-text{
    min-width:0;
}

.profile-text strong{
    display:block;
    font-size:13px;
}

.profile-text span{
    display:block;
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
}

/* =========================
   MAIN
========================= */

.main{
    min-width:0;
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    position:relative;
    background:var(--bg);
}

/* =========================
   HEADER
========================= */

.header{
    height:68px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid var(--border);
    background:var(--bg);
    position:relative;
    z-index:20;
}

.header-left,
.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.menu-btn,
.header-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:11px;
    background:transparent;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.18s;
}

.menu-btn:hover,
.header-btn:hover{
    background:var(--hover);
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-left:3px;
}

.brand-logo{
    width:34px;
    height:34px;
    object-fit:cover;
    border-radius:9px;
    background:var(--panel);
}

.brand-name{
    font-size:16px;
    font-weight:700;
    letter-spacing:-.02em;
}

.brand-status{
    display:flex;
    align-items:center;
    gap:5px;
    color:var(--muted);
    font-size:11px;
}

.status-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#22c55e;
}

/* =========================
   CHAT
========================= */

.chat{
    flex:1;
    overflow-y:auto;
    scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
    width:7px;
}

.chat::-webkit-scrollbar-thumb{
    background:var(--border);
    border-radius:20px;
}

.chat-inner{
    width:min(850px,100%);
    margin:0 auto;
    padding:40px 24px 150px;
}

/* =========================
   WELCOME
========================= */

.welcome{
    min-height:calc(100vh - 230px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px 0;
}

.welcome-logo{
    width:72px;
    height:72px;
    border-radius:20px;
    object-fit:cover;
    margin-bottom:22px;
    box-shadow:var(--shadow);
}

.welcome h1{
    font-size:32px;
    letter-spacing:-.04em;
    margin-bottom:10px;
}

.welcome p{
    max-width:500px;
    color:var(--muted);
    font-size:14px;
    line-height:1.7;
}

.quick-actions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    width:min(600px,100%);
    margin-top:30px;
}

.quick-btn{
    min-height:76px;
    padding:14px;
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:14px;
    text-align:left;
    color:var(--text);
    cursor:pointer;
    transition:.18s;
}

.quick-btn:hover{
    background:var(--hover);
    transform:translateY(-1px);
}

.quick-icon{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    margin-bottom:7px;
}

.quick-btn strong{
    display:block;
    font-size:13px;
}

.quick-btn span{
    display:block;
    margin-top:3px;
    color:var(--muted);
    font-size:11px;
}

/* =========================
   MESSAGE
========================= */

.message{
    display:flex;
    gap:14px;
    margin-bottom:30px;
    animation:messageIn .25s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(6px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message.user{
    justify-content:flex-end;
}

.message.user .message-content{
    max-width:75%;
}

.message.ai .message-content{
    flex:1;
    min-width:0;
}

.avatar{
    width:34px;
    height:34px;
    flex-shrink:0;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.user-avatar{
    background:var(--panel2);
    color:var(--muted);
}

.user-avatar svg{
    width:17px;
}

.message-body{
    min-width:0;
}

.message-name{
    font-size:11px;
    color:var(--muted);
    margin-bottom:7px;
    font-weight:600;
}

.user .message-name{
    text-align:right;
}

.bubble{
    line-height:1.7;
    font-size:14px;
    word-wrap:break-word;
}

.user .bubble{
    background:var(--panel2);
    border:1px solid var(--border);
    padding:11px 15px;
    border-radius:18px 18px 5px 18px;
}

.ai .bubble{
    padding:0;
}

.bubble p{
    margin-bottom:12px;
}

.bubble p:last-child{
    margin-bottom:0;
}

.bubble ul,
.bubble ol{
    padding-left:22px;
    margin:10px 0;
}

.bubble li{
    margin:4px 0;
}

.bubble code{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:5px;
    padding:2px 5px;
    font-size:12px;
}

.code-wrap{
    margin:14px 0;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:#09090c;
}

.code-head{
    height:36px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px 0 13px;
    background:rgba(255,255,255,.04);
    border-bottom:1px solid rgba(255,255,255,.07);
    color:#a1a1aa;
    font-size:11px;
}

.copy-code{
    border:0;
    background:transparent;
    color:#a1a1aa;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
    font-size:11px;
}

.copy-code:hover{
    color:#fff;
}

.code-wrap pre{
    padding:15px;
    overflow-x:auto;
    margin:0;
}

.code-wrap code{
    background:none;
    border:0;
    padding:0;
    color:#e5e7eb;
    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;
    font-size:12px;
    line-height:1.65;
}

.message-actions{
    display:flex;
    align-items:center;
    gap:4px;
    margin-top:9px;
}

.action-btn{
    height:30px;
    min-width:30px;
    padding:0 8px;
    border:0;
    border-radius:8px;
    background:transparent;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    cursor:pointer;
    font-size:11px;
}

.action-btn:hover{
    background:var(--hover);
    color:var(--text);
}

.action-btn svg{
    width:15px;
    height:15px;
}

/* =========================
   TYPING
========================= */

.typing{
    display:flex;
    align-items:center;
    gap:5px;
    height:24px;
}

.typing span{
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--muted);
    animation:typing 1.2s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{
    0%,60%,100%{
        transform:translateY(0);
        opacity:.35;
    }
    30%{
        transform:translateY(-4px);
        opacity:1;
    }
}

/* =========================
   INPUT AREA
========================= */

.input-area{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:16px 20px 18px;
    background:
        linear-gradient(
            to bottom,
            transparent,
            var(--bg) 22%
        );
    z-index:10;
}

.input-container{
    width:min(850px,100%);
    margin:0 auto;
}

.attach-preview{
    display:none;
    margin-bottom:8px;
    gap:7px;
    flex-wrap:wrap;
}

.file-chip{
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 9px;
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:9px;
    font-size:11px;
    color:var(--muted);
}

.file-remove{
    border:0;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    display:flex;
}

.input-box{
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:8px;
    min-height:58px;
    border:1px solid var(--border);
    border-radius:18px;
    background:var(--panel);
    box-shadow:var(--shadow);
    transition:.2s;
}

.input-box:focus-within{
    border-color:rgba(255,255,255,.18);
}

body.light .input-box:focus-within{
    border-color:rgba(0,0,0,.2);
}

.input-btn{
    width:40px;
    height:40px;
    flex-shrink:0;
    border:0;
    border-radius:11px;
    background:transparent;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.input-btn:hover{
    background:var(--hover);
    color:var(--text);
}

textarea{
    flex:1;
    width:100%;
    min-height:40px;
    max-height:180px;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    line-height:1.5;
    padding:9px 3px;
}

textarea::placeholder{
    color:var(--muted);
}

.send-btn{
    width:40px;
    height:40px;
    flex-shrink:0;
    border:0;
    border-radius:11px;
    background:var(--accent);
    color:var(--accentText);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.18s;
}

.send-btn:hover{
    transform:scale(1.04);
}

.send-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
    transform:none;
}

.disclaimer{
    text-align:center;
    color:var(--muted);
    font-size:10px;
    margin-top:8px;
}

/* =========================
   OVERLAY
========================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:40;
    display:none;
}

.overlay.show{
    display:block;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:85px;
    transform:translateX(-50%) translateY(15px);
    padding:10px 14px;
    background:#18181b;
    color:#fff;
    border:1px solid rgba(255,255,255,.1);
    border-radius:10px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:100;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:760px){

    .sidebar{
        position:fixed;
        left:0;
        top:0;
        bottom:0;
        width:285px;
        transform:translateX(-100%);
        box-shadow:20px 0 50px rgba(0,0,0,.35);
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .header{
        height:62px;
        padding:0 10px;
    }

    .brand-name{
        font-size:15px;
    }

    .brand-status{
        display:none;
    }

    .brand-logo{
        width:32px;
        height:32px;
    }

    .chat-inner{
        padding:28px 15px 140px;
    }

    .welcome{
        min-height:calc(100vh - 210px);
    }

    .welcome h1{
        font-size:26px;
    }

    .welcome p{
        font-size:13px;
    }

    .welcome-logo{
        width:64px;
        height:64px;
    }

    .quick-actions{
        grid-template-columns:1fr;
        margin-top:22px;
    }

    .message{
        gap:9px;
        margin-bottom:25px;
    }

    .message.user .message-content{
        max-width:85%;
    }

    .avatar{
        width:30px;
        height:30px;
        border-radius:9px;
    }

    .bubble{
        font-size:13px;
    }

    .input-area{
        padding:10px 10px 12px;
    }

    .input-box{
        min-height:54px;
        border-radius:16px;
    }

    .input-btn,
    .send-btn{
        width:38px;
        height:38px;
    }

    .disclaimer{
        font-size:9px;
    }
}

/* =========================
   REDUCED MOTION
========================= */

@media(prefers-reduced-motion:reduce){
    *{
        animation:none!important;
        transition:none!important;
        scroll-behavior:auto!important;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">

            <button class="new-chat" id="newChatBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                <span>Chat baru</span>
            </button>

        </div>

        <div class="sidebar-title">
            Riwayat
        </div>

        <div class="history" id="history">
            <div class="history-empty" id="historyEmpty">
                Belum ada percakapan.
            </div>
        </div>

        <div class="sidebar-bottom">

            <div class="profile">

                <img
                    src="logo.png"
                    class="profile-logo"
                    alt="oneAi"
                    onerror="this.style.display='none'"
                >

                <div class="profile-text">
                    <strong>oneAi</strong>
                    <span>Developed by ONEDEV</span>
                </div>

            </div>

        </div>

    </aside>

    <div class="overlay" id="overlay"></div>

    <!-- MAIN -->
    <main class="main">

        <!-- HEADER -->
        <header class="header">

            <div class="header-left">

                <button
                    class="menu-btn"
                    id="menuBtn"
                    aria-label="Menu"
                    title="Menu"
                >
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>

                <div class="brand">

                    <img
                        src="logo.png"
                        class="brand-logo"
                        alt="oneAi"
                        onerror="this.style.display='none'"
                    >

                    <div>
                        <div class="brand-name">oneAi</div>

                        <div class="brand-status">
                            <span class="status-dot"></span>
                            Online
                        </div>
                    </div>

                </div>

            </div>

            <div class="header-right">

                <button
                    class="header-btn"
                    id="themeBtn"
                    title="Ganti tema"
                    aria-label="Ganti tema"
                >
                    <svg
                        id="themeIcon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                    </svg>
                </button>

            </div>

        </header>

        <!-- CHAT -->
        <section class="chat" id="chat">

            <div class="chat-inner" id="chatInner">

                <!-- WELCOME -->
                <div class="welcome" id="welcome">

                    <img
                        src="logo.png"
                        class="welcome-logo"
                        alt="oneAi"
                        onerror="this.style.display='none'"
                    >

                    <h1>Bagaimana saya bisa membantu?</h1>

                    <p>
                        Tanya apa saja kepada oneAi.
                        Mulai dari coding, ide, informasi, sampai berbagai kebutuhan lainnya.
                    </p>

                    <div class="quick-actions">

                        <button
                            class="quick-btn"
                            data-prompt="Bantu saya membuat website modern menggunakan HTML, CSS, dan JavaScript."
                        >
                            <div class="quick-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 5h16v14H4z"/>
                                    <path d="m8 9 3 3-3 3M13 15h3"/>
                                </svg>
                            </div>

                            <strong>Bantu coding</strong>
                            <span>Buat atau perbaiki kode</span>
                        </button>

                        <button
                            class="quick-btn"
                            data-prompt="Berikan saya beberapa ide kreatif yang bisa saya kerjakan."
                        >
                            <div class="quick-icon">

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   oneAi FRONTEND
   Developed by ONEDEV
========================================================= */

const $ = (selector) => document.querySelector(selector);

const sidebar = $("#sidebar");
const overlay = $("#overlay");
const menuBtn = $("#menuBtn");
const themeBtn = $("#themeBtn");
const themeIcon = $("#themeIcon");

const newChatBtn = $("#newChatBtn");
const historyEl = $("#history");
const historyEmpty = $("#historyEmpty");

const chat = $("#chat");
const chatInner = $("#chatInner");
const welcome = $("#welcome");
const messages = $("#messages");

const prompt = $("#prompt");
const sendBtn = $("#sendBtn");

const attachBtn = $("#attachBtn");
const fileInput = $("#fileInput");
const attachPreview = $("#attachPreview");

const toast = $("#toast");

let currentChatId = null;
let isGenerating = false;
let selectedFiles = [];


/* =========================================================
   THEME
========================================================= */

function loadTheme(){

    const saved = localStorage.getItem("oneai_theme");

    if(saved === "light"){
        document.body.classList.add("light");
        setSunIcon();
    }else{
        document.body.classList.remove("light");
        setMoonIcon();
    }
}

function setSunIcon(){

    themeIcon.innerHTML = `
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    `;
}

function setMoonIcon(){

    themeIcon.innerHTML = `
        <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z"/>
    `;
}

themeBtn.addEventListener("click", () => {

    document.body.classList.toggle("light");

    const light = document.body.classList.contains("light");

    localStorage.setItem(
        "oneai_theme",
        light ? "light" : "dark"
    );

    light ? setSunIcon() : setMoonIcon();

});


/* =========================================================
   SIDEBAR
========================================================= */

function openSidebar(){

    sidebar.classList.add("open");
    overlay.classList.add("show");

}

function closeSidebar(){

    sidebar.classList.remove("open");
    overlay.classList.remove("show");

}

menuBtn.addEventListener("click", () => {

    if(window.innerWidth <= 760){

        if(sidebar.classList.contains("open")){
            closeSidebar();
        }else{
            openSidebar();
        }

    }else{

        sidebar.classList.toggle("collapsed");

    }

});

overlay.addEventListener("click", closeSidebar);


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(text){

    toast.textContent = text;
    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    },2200);

}


/* =========================================================
   TEXTAREA
========================================================= */

function resizeTextarea(){

    prompt.style.height = "auto";

    prompt.style.height =
        Math.min(prompt.scrollHeight,180) + "px";

}

prompt.addEventListener("input", resizeTextarea);

prompt.addEventListener("keydown", (e) => {

    if(e.key === "Enter" && !e.shiftKey){

        e.preventDefault();

        sendMessage();

    }

});


/* =========================================================
   FILE
========================================================= */

attachBtn.addEventListener("click", () => {

    fileInput.click();

});

fileInput.addEventListener("change", () => {

    selectedFiles = Array.from(fileInput.files);

    renderFiles();

});

function renderFiles(){

    attachPreview.innerHTML = "";

    if(!selectedFiles.length){

        attachPreview.style.display = "none";

        return;
    }

    attachPreview.style.display = "flex";

    selectedFiles.forEach((file,index) => {

        const chip = document.createElement("div");

        chip.className = "file-chip";

        chip.innerHTML = `
            <svg width="14" height="14"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/>
                <path d="M14 2v6h6"/>
            </svg>

            <span>${escapeHtml(file.name)}</span>

            <button class="file-remove" data-index="${index}">
                <svg width="13" height="13"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">
                    <path d="m6 6 12 12M18 6 6 18"/>
                </svg>
            </button>
        `;

        attachPreview.appendChild(chip);

    });

    document.querySelectorAll(".file-remove").forEach(btn => {

        btn.addEventListener("click", () => {

            const index = Number(btn.dataset.index);

            selectedFiles.splice(index,1);

            renderFiles();

        });

    });

}


/* =========================================================
   QUICK PROMPTS
========================================================= */

document.querySelectorAll(".quick-btn").forEach(btn => {

    btn.addEventListener("click", () => {

        prompt.value = btn.dataset.prompt;

        resizeTextarea();

        prompt.focus();

    });

});


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   SIMPLE MARKDOWN
========================================================= */

function renderMarkdown(text){

    if(!text) return "";

    let html = escapeHtml(text);

    /* code block */

    html = html.replace(
        /```([\w-]*)\n?([\s\S]*?)```/g,
        (_,lang,code) => {

            const language = lang || "code";

            return `
                <div class="code-wrap">

                    <div class="code-head">

                        <span>${language}</span>

                        <button
                            class="copy-code"
                            data-code="${encodeURIComponent(code.trim())}"
                        >
                            <svg width="13" height="13"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <path d="M8 8h8v8H8z"/>
                            </svg>

                            Copy
                        </button>

                    </div>

                    <pre><code>${code.trim()}</code></pre>

                </div>
            `;

        }
    );

    /* bold */

    html = html.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
    );

    /* italic */

    html = html.replace(
        /\*(.*?)\*/g,
        "<em>$1</em>"
    );

    /* inline code */

    html = html.replace(
        /`([^`]+)`/g,
        "<code>$1</code>"
    );

    /* links */

    html = html.replace(
        /(https?:\/\/[^\s<]+)/g,
        '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
    );

    /* paragraphs */

    const lines = html.split("\n");

    let output = "";
    let list = false;

    lines.forEach(line => {

        const trimmed = line.trim();

        if(!trimmed){

            if(list){
                output += "</ul>";
                list = false;
            }

            return;

        }

        if(/^[-*]\s+/.test(trimmed)){

            if(!list){

                output += "<ul>";
                list = true;

            }

            output +=
                "<li>" +
                trimmed.replace(/^[-*]\s+/,"") +
                "</li>";

            return;

        }

        if(list){

            output += "</ul>";
            list = false;

        }

        output += "<p>" + trimmed + "</p>";

    });

    if(list){
        output += "</ul>";
    }

    return output;

}


/* =========================================================
   ADD USER MESSAGE
========================================================= */

function addUserMessage(text,files=[]){

    welcome.style.display = "none";

    const el = document.createElement("div");

    el.className = "message user";

    let fileHtml = "";

    if(files.length){

        fileHtml = `
            <div style="
                margin-top:8px;
                display:flex;
                flex-wrap:wrap;
                gap:5px;
            ">
                ${files.map(file => `
                    <div class="file-chip">
                        ${escapeHtml(file.name)}
                    </div>
                `).join("")}
            </div>
        `;

    }

    el.innerHTML = `

        <div class="message-content">

            <div class="message-name">
                You
            </div>

            <div class="bubble">

                ${escapeHtml(text).replace(/\n/g,"<br>")}

                ${fileHtml}

            </div>

        </div>

        <div class="avatar user-avatar">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21a8 8 0 0 1 16 0"/>
            </svg>

        </div>

    `;

    messages.appendChild(el);

    scrollBottom();

}


/* =========================================================
   ADD AI MESSAGE
========================================================= */

function addAiMessage(content="",loading=false){

    welcome.style.display = "none";

    const el = document.createElement("div");

    el.className = "message ai";

    el.innerHTML = `

        <div class="avatar">

            <img
                src="logo.png"
                alt="oneAi"
                onerror="this.style.display='none'"
            >

        </div>

        <div class="message-content">

            <div class="message-name">
                oneAi
            </div>

            <div class="bubble" data-bubble>

                ${
                    loading
                    ?
                    `
                    <div class="typing">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    `
                    :
                    renderMarkdown(content)
                }

            </div>

            ${
                !loading
                ?
                `
                <div class="message-actions">

                    <button
                        class="action-btn copy-answer"
                        title="Salin"
                    >
                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2">
                            <rect x="9" y="9" width="11" height="11" rx="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                    </button>

                    <button
                        class="action-btn regenerate"
                        title="Buat ulang"
                    >
                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2">
                            <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 5v4h4"/>
                            <path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 19v-4h-4"/>
                        </svg>
                    </button>

                </div>
                `
                :
                ""
            }

        </div>

    `;

    messages.appendChild(el);

    if(!loading){

        attachMessageActions(el);

    }

    scrollBottom();

    return el;

}


/* =========================================================
   MESSAGE ACTIONS
========================================================= */

function attachMessageActions(el){

    const copy = el.querySelector(".copy-answer");

    if(copy){

        copy.addEventListener("click", async () => {

            const bubble = el.querySelector(".bubble");

            try{

                await navigator.clipboard.writeText(
                    bubble.innerText
                );

                showToast("Jawaban disalin");

            }catch{

                showToast("Gagal menyalin");

            }

        });

    }

    const regen = el.querySelector(".regenerate");

    if(regen){

        regen.addEventListener("click", () => {

            const lastUser =
                messages.querySelector(".message.user:last-of-type");

            if(!lastUser) return;

            const bubble =
                lastUser.querySelector(".bubble");

            if(!bubble) return;

            const text = bubble.innerText.trim();

            if(text){

                prompt.value = text;

                sendMessage();

            }

        });

    }

    el.querySelectorAll(".copy-code").forEach(btn => {

        btn.addEventListener("click", async () => {

            const code =
                decodeURIComponent(btn.dataset.code);

            try{

                await navigator.clipboard.writeText(code);

                btn.innerHTML = "Copied";

                setTimeout(() => {

                    btn.innerHTML = "Copy";

                },1200);

            }catch{

                showToast("Gagal menyalin kode");

            }

        });

    });

}


/* =========================================================
   SCROLL
========================================================= */

function scrollBottom(){

    requestAnimationFrame(() => {

        chat.scrollTop = chat.scrollHeight;

    });

}


/* =========================================================
   API
========================================================= */

async function sendMessage(){

    if(isGenerating) return;

    const text = prompt.value.trim();

    if(!text && !selectedFiles.length){

        prompt.focus();

        return;

    }

    const filesForDisplay = [...selectedFiles];

    prompt.value = "";

    resizeTextarea();

    addUserMessage(
        text || "Tolong analisis file yang saya lampirkan.",
        filesForDisplay
    );

    selectedFiles = [];

    fileInput.value = "";

    renderFiles();

    isGenerating = true;

    sendBtn.disabled = true;

    const aiEl = addAiMessage("",true);

    const bubble = aiEl.querySelector("[data-bubble]");

    try{

        /*
         * Backend yang digunakan:
         * /api/ask
         *
         * Jika backend lu menggunakan endpoint berbeda,
         * ubah URL di bawah.
         */

        const formData = new FormData();

        formData.append(
            "message",
            text || "Analisis file yang saya lampirkan."
        );

        if(currentChatId){

            formData.append(
                "chat_id",
                currentChatId
            );

        }

        filesForDisplay.forEach(file => {

            formData.append("files",file);

        });

        const response = await fetch("/api/ask",{
            method:"POST",
            body:formData
        });

        if(!response.ok){

            throw new Error(
                "Server error " + response.status
            );

        }

        const data = await response.json();

        /*
         * Mendukung beberapa kemungkinan
         * format response backend.
         */

        const answer =
            data.response ||
            data.answer ||
            data.message ||
            data.content ||
            data.text ||
            "";

        currentChatId =
            data.chat_id ||
            currentChatId;

        if(!answer){

            throw new Error(
                "Server tidak mengembalikan jawaban."
            );

        }

        bubble.innerHTML =
            renderMarkdown(answer);

        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";

        actions.innerHTML = `

            <button
                class="action-btn copy-answer"
                title="Salin"
            >
                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">
                    <rect x="9" y="9" width="11" height="11" rx="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
            </button>

            <button
                class="action-btn regenerate"
                title="Buat ulang"
            >
                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">
                    <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 5v4h4"/>
                    <path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 19v-4h-4"/>
                </svg>
            </button>

        `;

        aiEl
            .querySelector(".message-body");

        aiEl
            .querySelector(".message-content")
            .appendChild(actions);

        attachMessageActions(aiEl);

        saveLocalChat();

        loadHistory();

    }catch(error){

        bubble.innerHTML = `
            <p>
                <strong>Terjadi kesalahan.</strong>
            </p>

            <p style="color:var(--muted)">
                ${escapeHtml(error.message)}
            </p>
        `;

        showToast("Gagal menghubungi AI");

    }finally{

        isGenerating = false;

        sendBtn.disabled = false;

        scrollBottom();

        prompt.focus();

    }

}


/* =========================================================
   NEW CHAT
========================================================= */

newChatBtn.addEventListener("click", () => {

    startNewChat();

});

function startNewChat(){

    currentChatId = null;

    messages.innerHTML = "";

    welcome.style.display = "flex";

    prompt.value = "";

    resizeTextarea();

    selectedFiles = [];

    fileInput.value = "";

    renderFiles();

    if(window.innerWidth <= 760){

        closeSidebar();

    }

    prompt.focus();

}


/* =========================================================
   LOCAL HISTORY
========================================================= */

function getLocalChats(){

    try{

        return JSON.parse(
            localStorage.getItem("oneai_chats") || "[]"
        );

    }catch{

        return [];

    }

}

function saveLocalChat(){

    const text =
        messages.querySelector(".message.user .bubble")
        ?.innerText
        ?.trim();

    if(!text) return;

    const chats = getLocalChats();

    const id =
        currentChatId ||
        "local-" + Date.now();

    currentChatId = id;

    const existing =
        chats.find(x => x.id === id);

    if(existing){

        existing.title =
            text.slice(0,45);

        existing.updated =
            Date.now();

    }else{

        chats.unshift({
            id,
            title:text.slice(0,45),
            updated:Date.now()
        });

    }

    localStorage.setItem(
        "oneai_chats",
        JSON.stringify(chats.slice(0,30))
    );

}


/* =========================================================
   HISTORY UI
========================================================= */

function loadHistory(){

    const chats = getLocalChats();

    historyEl.innerHTML = "";

    if(!chats.length){

        historyEl.appendChild(
            historyEmpty
        );

        return;

    }

    chats.forEach(item => {

        const el =
            document.createElement("div");

        el.className =
            "history-item" +
            (item.id === currentChatId
                ? " active"
                : "");

        el.innerHTML = `

            <div class="history-icon">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">
                    <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/>
                </svg>

            </div>

            <div class="history-name">
                ${escapeHtml(item.title)}
            </div>

            <button
                class="history-delete"
                title="Hapus"
            >
                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">
                    <path d="M3 6h18"/>
                    <path d="M8 6V4h8v2"/>
                    <path d="m19 6-1 15H6L5 6"/>
                    <path d="M10 11v6M14 11v6"/>
                </svg>
            </button>

        `;

        el.addEventListener("click",(e)=>{

            if(
                e.target.closest(".history-delete")
            ) return;

            currentChatId = item.id;

            showToast(
                "Riwayat lokal tersedia"
            );

        });

        el.querySelector(
            ".history-delete"
        ).addEventListener("click",(e)=>{

            e.stopPropagation();

            deleteLocalChat(item.id);

        });

        historyEl.appendChild(el);

    });

}

function deleteLocalChat(id){

    const chats =
        getLocalChats()
        .filter(x => x.id !== id);

    localStorage.setItem(
        "oneai_chats",
        JSON.stringify(chats)
    );

    if(currentChatId === id){

        startNewChat();

    }

    loadHistory();

    showToast("Percakapan dihapus");

}


/* =========================================================
   INIT
========================================================= */

loadTheme();

loadHistory();

prompt.focus();

</script>
