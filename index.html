<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>oneAi — AI Assistant</title>

<meta name="theme-color" content="#0b0c0f">
<meta name="description" content="oneAi — AI Assistant by ONEDEV">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    background:#08090c;
    color:#f4f4f5;
}

body{
    position:relative;
}

/* =========================================================
   APP
========================================================= */

#app{
    position:relative;
    width:100%;
    height:100dvh;
    overflow:hidden;
    background:#08090c;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    position:absolute;
    z-index:100;
    top:0;
    left:0;
    right:0;

    height:64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:rgba(8,9,12,.94);
    border-bottom:1px solid rgba(255,255,255,.07);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.menu-btn{
    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;
    outline:none;
    background:transparent;
    color:#d9dce3;

    border-radius:12px;

    cursor:pointer;
    touch-action:manipulation;
}

.menu-btn:active{
    background:rgba(255,255,255,.08);
}

.menu-btn svg{
    width:22px;
    height:22px;
}

.logo-mini{
    width:32px;
    height:32px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:linear-gradient(
        145deg,
        #ffffff 0%,
        #e9e9ed 100%
    );

    color:#090a0d;

    font-weight:900;
    font-size:13px;

    box-shadow:
        0 0 0 1px rgba(255,255,255,.15),
        0 5px 20px rgba(255,255,255,.05);
}

.brand{
    min-width:0;
}

.brand-name{
    font-size:18px;
    font-weight:800;
    letter-spacing:-.4px;
}

.brand-sub{
    margin-top:1px;
    color:#777c87;
    font-size:11px;
}

.header-action{
    width:40px;
    height:40px;

    border:0;
    outline:none;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#9da2ae;
    background:transparent;

    border-radius:12px;

    cursor:pointer;
    touch-action:manipulation;
}

.header-action:active{
    background:rgba(255,255,255,.08);
}

.header-action svg{
    width:20px;
    height:20px;
}

/* =========================================================
   CHAT
========================================================= */

.chat{
    position:absolute;
    z-index:10;

    top:64px;
    left:0;
    right:0;
    bottom:0;

    overflow-y:auto;
    overflow-x:hidden;

    padding:25px 16px 180px;

    scroll-behavior:smooth;

    overscroll-behavior:contain;

    -webkit-overflow-scrolling:touch;
}

.chat::-webkit-scrollbar{
    width:5px;
}

.chat::-webkit-scrollbar-thumb{
    background:#292c33;
    border-radius:20px;
}

/* =========================================================
   WELCOME
========================================================= */

.welcome{
    width:min(680px,100%);
    margin:50px auto 0;

    text-align:center;
}

.welcome-logo{
    width:70px;
    height:70px;

    margin:0 auto 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:22px;

    background:#f4f4f5;
    color:#090a0d;

    font-size:27px;
    font-weight:900;

    box-shadow:
        0 12px 50px rgba(255,255,255,.08);
}

.welcome h1{
    font-size:30px;
    letter-spacing:-1px;
    margin-bottom:9px;
}

.welcome p{
    color:#858a95;
    font-size:14px;
    line-height:1.6;
}

/* =========================================================
   SUGGESTIONS
========================================================= */

.suggestions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;

    width:min(680px,100%);
    margin:30px auto 0;
}

.suggestion{
    min-height:74px;

    padding:14px;

    text-align:left;

    border:1px solid rgba(255,255,255,.07);
    border-radius:16px;

    background:#101116;

    color:#cfd2d9;

    cursor:pointer;
    touch-action:manipulation;

    transition:.18s ease;
}

.suggestion:hover{
    background:#15171d;
    border-color:rgba(255,255,255,.13);
}

.suggestion:active{
    transform:scale(.98);
}

.suggestion-title{
    font-size:13px;
    font-weight:700;
    margin-bottom:5px;
}

.suggestion-text{
    color:#747985;
    font-size:11px;
}

/* =========================================================
   MESSAGE
========================================================= */

.message{
    width:min(850px,100%);
    margin:0 auto 25px;

    display:flex;
    gap:12px;

    animation:messageIn .2s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(7px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.avatar{
    flex:none;

    width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;

    font-size:12px;
    font-weight:800;
}

.user-avatar{
    background:#f3f3f4;
    color:#0a0b0e;
}

.ai-avatar{
    background:#181a20;
    border:1px solid rgba(255,255,255,.08);
    color:#fff;
}

.message-content{
    min-width:0;
    flex:1;
}

.message-name{
    margin:2px 0 7px;

    font-size:12px;
    font-weight:700;

    color:#858a95;
}

.user .message-name{
    color:#cfd2d8;
}

.message-text{
    color:#e4e6ea;

    font-size:15px;
    line-height:1.75;

    word-wrap:break-word;
    overflow-wrap:anywhere;
}

.user .message-text{
    display:inline-block;

    padding:11px 15px;

    background:#171920;

    border:1px solid rgba(255,255,255,.05);

    border-radius:18px 18px 5px 18px;

    color:#f1f2f4;

    line-height:1.55;
}

.message-text pre{
    position:relative;

    margin:15px 0;

    padding:16px;

    overflow-x:auto;

    border-radius:13px;

    background:#0d0e12;

    border:1px solid rgba(255,255,255,.07);

    font-size:13px;
}

.message-text code{
    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
}

.message-text p{
    margin-bottom:12px;
}

.message-text p:last-child{
    margin-bottom:0;
}

.message-text ul,
.message-text ol{
    padding-left:22px;
    margin:10px 0;
}

.message-text li{
    margin:5px 0;
}

/* =========================================================
   MESSAGE ACTIONS
========================================================= */

.message-actions{
    display:flex;
    gap:5px;

    margin-top:9px;
}

.msg-btn{
    width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;
    background:transparent;

    color:#656b76;

    border-radius:9px;

    cursor:pointer;
    touch-action:manipulation;
}

.msg-btn:hover{
    background:#15171c;
    color:#bfc3cb;
}

.msg-btn:active{
    transform:scale(.93);
}

.msg-btn svg{
    width:17px;
    height:17px;
}

/* =========================================================
   TYPING
========================================================= */

.typing{
    display:flex;
    align-items:center;
    gap:4px;

    height:25px;
}

.typing span{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#858a94;

    animation:typing 1.2s infinite ease-in-out;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{
    0%,60%,100%{
        transform:translateY(0);
        opacity:.35;
    }
    30%{
        transform:translateY(-4px);
        opacity:1;
    }
}

/* =========================================================
   INPUT AREA
========================================================= */

.composer-wrap{
    position:absolute;
    z-index:120;

    left:0;
    right:0;
    bottom:0;

    padding:12px 16px 15px;

    background:
        linear-gradient(
            to top,
            #08090c 65%,
            rgba(8,9,12,.92) 82%,
            rgba(8,9,12,0)
        );

    pointer-events:none;
}

.composer{
    width:min(850px,100%);
    margin:auto;

    pointer-events:auto;

    display:flex;
    align-items:flex-end;
    gap:9px;

    min-height:58px;

    padding:9px;

    border:1px solid #292c34;
    border-radius:20px;

    background:#111318;

    box-shadow:
        0 10px 40px rgba(0,0,0,.35);

    transition:.2s ease;
}

.composer:focus-within{
    border-color:#444852;
    box-shadow:
        0 0 0 3px rgba(255,255,255,.025),
        0 10px 40px rgba(0,0,0,.4);
}

.attach-btn{
    flex:none;

    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;
    background:transparent;

    color:#747985;

    border-radius:12px;

    cursor:pointer;
    touch-action:manipulation;
}

.attach-btn:hover{
    background:#1b1d23;
    color:#c8cbd1;
}

.attach-btn svg{
    width:20px;
    height:20px;
}

#fileInput{
    display:none;
}

#input{
    flex:1;

    min-width:0;

    max-height:150px;

    padding:10px 3px;

    resize:none;

    overflow-y:auto;

    border:0;
    outline:none;

    background:transparent;

    color:#f0f1f3;

    font-family:inherit;
    font-size:15px;
    line-height:1.5;
}

#input::placeholder{
    color:#666b76;
}

.send-btn{
    flex:none;

    width:43px;
    height:43px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;

    border-radius:14px;

    background:#f4f4f5;
    color:#0a0b0e;

    cursor:pointer;
    touch-action:manipulation;

    transition:.15s ease;
}

.send-btn:hover{
    background:#fff;
}

.send-btn:active{
    transform:scale(.94);
}

.send-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
}

.send-btn svg{
    width:21px;
    height:21px;
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
    width:min(850px,100%);
    margin:7px auto 0;

    text-align:center;

    color:#4f545f;

    font-size:10px;

    pointer-events:none;
}

.footer b{
    color:#747984;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    position:absolute;
    z-index:300;

    top:0;
    bottom:0;
    left:0;

    width:285px;

    display:flex;
    flex-direction:column;

    background:#0d0f13;

    border-right:1px solid rgba(255,255,255,.07);

    transform:translateX(-105%);

    transition:transform .25s cubic-bezier(.2,.8,.2,1);

    box-shadow:20px 0 60px rgba(0,0,0,.35);
}

.sidebar.open{
    transform:translateX(0);
}

.sidebar-head{
    height:64px;

    padding:0 15px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid rgba(255,255,255,.07);
}

.sidebar-brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.sidebar-title{
    font-weight:800;
}

.close-sidebar{
    width:38px;
    height:38px;

    border:0;
    background:transparent;

    color:#858a94;

    border-radius:11px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
    touch-action:manipulation;
}

.close-sidebar:hover{
    background:#17191f;
}

.new-chat{
    margin:14px;

    height:46px;

    border:1px solid rgba(255,255,255,.08);

    border-radius:13px;

    background:#15171c;

    color:#e5e7eb;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    font-weight:700;
    font-size:13px;

    cursor:pointer;
    touch-action:manipulation;
}

.new-chat:hover{
    background:#1b1d23;
}

.new-chat svg{
    width:17px;
    height:17px;
}

.history{
    flex:1;

    overflow-y:auto;

    padding:0 9px;
}

.history-title{
    padding:10px 9px 7px;

    color:#555a65;

    font-size:10px;
    font-weight:700;

    text-transform:uppercase;
    letter-spacing:.7px;
}

.history-item{
    width:100%;

    padding:11px 10px;

    border:0;
    background:transparent;

    border-radius:10px;

    text-align:left;

    color:#b8bcc5;

    font-size:12px;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;

    cursor:pointer;
    touch-action:manipulation;
}

.history-item:hover{
    background:#15171c;
    color:#f0f1f3;
}

.sidebar-footer{
    padding:14px;

    border-top:1px solid rgba(255,255,255,.07);

    color:#555a65;

    font-size:10px;
    line-height:1.5;
}

.sidebar-footer strong{
    color:#858a95;
}

/* =========================================================
   SIDEBAR BACKDROP
========================================================= */

.sidebar-backdrop{
    position:absolute;
    z-index:250;

    inset:0;

    background:rgba(0,0,0,.55);

    opacity:0;
    visibility:hidden;

    transition:.2s ease;

    cursor:pointer;

    pointer-events:none;
}

.sidebar-backdrop.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:absolute;
    z-index:500;

    left:50%;
    bottom:110px;

    transform:translate(-50%,20px);

    padding:10px 15px;

    border-radius:12px;

    background:#1b1e25;
    border:1px solid rgba(255,255,255,.08);

    color:#dfe2e7;

    font-size:12px;

    opacity:0;
    visibility:hidden;

    transition:.2s ease;

    pointer-events:none;

    white-space:nowrap;
}

.toast.show{
    opacity:1;
    visibility:visible;
    transform:translate(-50%,0);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .header{
        height:60px;
        padding:0 12px;
    }

    .chat{
        top:60px;
        padding:20px 13px 175px;
    }

    .welcome{
        margin-top:40px;
    }

    .welcome-logo{
        width:62px;
        height:62px;
        font-size:24px;
    }

    .welcome h1{
        font-size:26px;
    }

    .suggestions{
        grid-template-columns:1fr;
        margin-top:24px;
    }

    .message{
        gap:9px;
        margin-bottom:21px;
    }

    .avatar{
        width:31px;
        height:31px;
        border-radius:10px;
        font-size:10px;
    }

    .message-text{
        font-size:14px;
        line-height:1.7;
    }

    .composer-wrap{
        padding:9px 10px 10px;
    }

    .composer{
        min-height:56px;
        border-radius:18px;
    }

    #input{
        font-size:14px;
    }

    .footer{
        font-size:9px;
    }

    .sidebar{
        width:min(285px,86vw);
    }
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
        scroll-behavior:auto !important;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="header-left">

            <button
                class="menu-btn"
                id="menuBtn"
                type="button"
                aria-label="Buka menu"
            >
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round">
                    <path d="M4 6h16"/>
                    <path d="M4 12h16"/>
                    <path d="M4 18h16"/>
                </svg>
            </button>

            <div class="logo-mini">
                AI
            </div>

            <div class="brand">
                <div class="brand-name">oneAi</div>
                <div class="brand-sub">AI Assistant</div>
            </div>

        </div>

        <button
            class="header-action"
            id="newChatTop"
            type="button"
            aria-label="Chat baru"
        >
            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round">
                <path d="M12 5v14"/>
                <path d="M5 12h14"/>
            </svg>
        </button>

    </header>


    <!-- =====================================================
         CHAT
    ====================================================== -->

    <main
        class="chat"
        id="chat"
    >

        <section
            class="welcome"
            id="welcome"
        >

            <div class="welcome-logo">
                AI
            </div>

            <h1>Halo, gue oneAi.</h1>

            <p>
                Asisten AI untuk bantu menjawab pertanyaan,
                membuat ide, coding, dan berbagai kebutuhan kamu.
            </p>

            <div class="suggestions">

                <button
                    class="suggestion"
                    type="button"
                    data-prompt="Jelaskan bagaimana AI bekerja dengan bahasa yang mudah dimengerti."
                >
                    <div class="suggestion-title">
                        🤖 Pelajari AI
                    </div>

                    <div class="suggestion-text">
                        Jelaskan dengan bahasa sederhana
                    </div>
                </button>

                <button
                    class="suggestion"
                    type="button"
                    data-prompt="Bantu saya membuat sebuah website modern menggunakan HTML, CSS, dan JavaScript."
                >
                    <div class="suggestion-title">
                        💻 Bantu coding
                    </div>

                    <div class="suggestion-text">
                        Buat atau perbaiki kode
                    </div>
                </button>

                <button
                    class="suggestion"
                    type="button"
                    data-prompt="Berikan saya 10 ide konten yang menarik untuk media sosial."
                >
                    <div class="suggestion-title">
                        💡 Cari ide
                    </div>

                    <div class="suggestion-text">
                        Brainstorm ide baru
                    </div>
                </button>

                <button
                    class="suggestion"
                    type="button"
                    data-prompt="Bantu saya membuat rencana belajar coding dari dasar sampai bisa membuat website."
                >
                    <div class="suggestion-title">
                        📚 Belajar
                    </div>

                    <div class="suggestion-text">
                        Buatkan roadmap belajar
                    </div>
                </button>

            </div>

        </section>

        <div id="messages"></div>

    </main>


    <!-- =====================================================
         COMPOSER
    ====================================================== -->

    <div class="composer-wrap">

        <form
            class="composer"
            id="form"
            autocomplete="off"
        >

            <input
                id="fileInput"
                type="file"
                multiple
            >

            <button
                type="button"
                class="attach-btn"
                id="attachBtn"
                aria-label="Lampirkan file"
            >
                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.82-2.83l8.48-8.48"/>
                </svg>
            </button>

            <textarea
                id="input"
                rows="1"
                placeholder="Tulis pesan untuk oneAi..."
                spellcheck="true"
            ></textarea>

            <button
                type="submit"
                class="send-btn"
                id="send"
                aria-label="Kirim"
            >
                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <path d="M12 19V5"/>
                    <path d="m5 12 7-7 7 7"/>
                </svg>
            </button>

        </form>

        <div class="footer">
            oneAi dapat membuat kesalahan. Periksa informasi penting.
            <br>
            <span>By Developer <b>ONEDEV</b></span>
        </div>

    </div>


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-head">

            <div class="sidebar-brand">

                <div class="logo-mini">
                    AI
                </div>

                <div class="sidebar-title">
                    oneAi
                </div>

            </div>

            <button
                class="close-sidebar"
                id="closeSidebar"
                type="button"
                aria-label="Tutup menu"
            >
                <svg viewBox="0 0 24 24"
                     width="20"
                     height="20"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round">
                    <path d="M6 6l12 12"/>
                    <path d="M18 6 6 18"/>
                </svg>
            </button>

        </div>


        <button
            class="new-chat"
            id="newChat"
            type="button"
        >

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round">
                <path d="M12 5v14"/>
                <path d="M5 12h14"/>
            </svg>

            Chat Baru

        </button>


        <div class="history">

            <div class="history-title">
                Percakapan
            </div>

            <div id="historyList"></div>

        </div>


        <div class="sidebar-footer">

            oneAi<br>

            <strong>
                Developed by ONEDEV
            </strong>

        </div>

    </aside>


    <div
        class="sidebar-backdrop"
        id="sidebarBackdrop"
    ></div>


    <div
        class="toast"
        id="toast"
    ></div>

</div>


<script>
"use strict";

/* =========================================================
   ELEMENTS
========================================================= */

const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const chat = document.getElementById("chat");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");

const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");
const closeSidebar = document.getElementById("closeSidebar");
const sidebarBackdrop = document.getElementById("sidebarBackdrop");

const newChat = document.getElementById("newChat");
const newChatTop = document.getElementById("newChatTop");

const attachBtn = document.getElementById("attachBtn");
const fileInput = document.getElementById("fileInput");

const toast = document.getElementById("toast");
const historyList = document.getElementById("historyList");


/* =========================================================
   STATE
========================================================= */

let history = [];
let busy = false;
let currentChatId = null;


/* =========================================================
   SAFE HTML
========================================================= */

function escapeHTML(text){

    return String(text ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   BASIC MARKDOWN
========================================================= */

function markdown(text){

    let safe = escapeHTML(text);

    safe = safe.replace(
        /```([\s\S]*?)```/g,
        function(_, code){
            return "<pre><code>" +
                code.trim() +
                "</code></pre>";
        }
    );

    safe = safe.replace(
        /`([^`]+)`/g,
        "<code>$1</code>"
    );

    safe = safe.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
    );

    safe = safe.replace(
        /\*(.*?)\*/g,
        "<em>$1</em>"
    );

    safe = safe.replace(
        /\n/g,
        "<br>"
    );

    return safe;
}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(text){

    clearTimeout(toastTimer);

    toast.textContent = text;
    toast.classList.add("show");

    toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    },2200);
}


/* =========================================================
   SCROLL
========================================================= */

function scrollBottom(){

    requestAnimationFrame(() => {

        chat.scrollTo({
            top:chat.scrollHeight,
            behavior:"smooth"
        });

    });
}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(role,text){

    welcome.style.display = "none";

    const item = document.createElement("div");

    item.className =
        "message " +
        (role === "user" ? "user" : "ai");

    const avatar =
        role === "user"
        ? "U"
        : "AI";

    const name =
        role === "user"
        ? "Kamu"
        : "oneAi";

    item.innerHTML = `

        <div class="avatar ${
            role === "user"
            ? "user-avatar"
            : "ai-avatar"
        }">
            ${avatar}
        </div>

        <div class="message-content">

            <div class="message-name">
                ${name}
            </div>

            <div class="message-text">
                ${markdown(text)}
            </div>

            ${
                role === "ai"
                ? `
                <div class="message-actions">

                    <button
                        class="msg-btn copy-btn"
                        type="button"
                        title="Salin"
                    >

                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round">
                            <rect x="9" y="9"
                                  width="11"
                                  height="11"
                                  rx="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>

                    </button>

                    <button
                        class="msg-btn regen-btn"
                        type="button"
                        title="Buat ulang"
                    >

                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round">
                            <path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/>
                            <path d="M21 3v5h-5"/>
                            <path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/>
                            <path d="M3 21v-5h5"/>
                        </svg>

                    </button>

                </div>
                `
                : ""
            }

        </div>
    `;

    messages.appendChild(item);

    scrollBottom();

    return item;
}


/* =========================================================
   TYPING MESSAGE
========================================================= */

function addTyping(){

    welcome.style.display = "none";

    const item = document.createElement("div");

    item.className = "message ai";

    item.id = "typingMessage";

    item.innerHTML = `

        <div class="avatar ai-avatar">
            AI
        </div>

        <div class="message-content">

            <div class="message-name">
                oneAi
            </div>

            <div class="typing">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>
    `;

    messages.appendChild(item);

    scrollBottom();

    return item;
}


/* =========================================================
   SEND API
========================================================= */

async function sendMessage(text){

    if(busy) return;

    text = String(text || "").trim();

    if(!text) return;

    busy = true;

    send.disabled = true;

    addMessage("user",text);

    input.value = "";

    resizeInput();

    history.push({
        role:"user",
        content:text
    });

    const typing = addTyping();

    try{

        const response = await fetch("/api/ask",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                message:text,

                history:history

            })

        });


        const raw = await response.text();

        let data;

        try{

            data = JSON.parse(raw);

        }catch(error){

            throw new Error(
                raw ||
                "Server mengembalikan data yang tidak valid."
            );

        }


        if(!response.ok){

            throw new Error(
                data.error ||
                data.message ||
                "Terjadi kesalahan pada server."
            );

        }


        typing.remove();


        const answer =
            data.response ??
            data.answer ??
            data.message ??
            data.content ??
            data.text ??
            "";


        if(!answer){

            throw new Error(
                "AI tidak mengembalikan jawaban."
            );

        }


        addMessage("ai",answer);


        history.push({
            role:"assistant",
            content:answer
        });


        saveHistory();

    }catch(error){

        typing.remove();

        const msg =
            error?.message ||
            "Terjadi kesalahan.";

        addMessage(
            "ai",
            "Maaf, terjadi error: " + msg
        );

        showToast("Gagal menghubungi oneAi.");

    }finally{

        busy = false;

        send.disabled = false;

        input.focus();

    }
}


/* =========================================================
   FORM
========================================================= */

form.addEventListener("submit",function(e){

    e.preventDefault();

    const text = input.value.trim();

    if(!text || busy) return;

    sendMessage(text);

});


/* =========================================================
   ENTER
========================================================= */

input.addEventListener("keydown",function(e){

    if(e.key === "Enter" && !e.shiftKey){

        e.preventDefault();

        form.requestSubmit();

    }

});


/* =========================================================
   AUTO RESIZE
========================================================= */

function resizeInput(){

    input.style.height = "auto";

    input.style.height =
        Math.min(input.scrollHeight,150) + "px";

}

input.addEventListener(
    "input",
    resizeInput
);


/* =========================================================
   SUGGESTIONS
========================================================= */

document.querySelectorAll(
    ".suggestion"
).forEach(button => {

    button.addEventListener("click",function(){

        const prompt =
            this.dataset.prompt || "";

        input.value = prompt;

        resizeInput();

        input.focus();

    });

});


/* =========================================================
   SIDEBAR
========================================================= */

function openSidebar(){

    sidebar.classList.add("open");

    sidebarBackdrop.classList.add("show");

}

function closeSide(){

    sidebar.classList.remove("open");

    sidebarBackdrop.classList.remove("show");

}

menuBtn.addEventListener(
    "click",
    openSidebar
);

closeSidebar.addEventListener(
    "click",
    closeSide
);

sidebarBackdrop.addEventListener(
    "click",
    closeSide
);


/* =========================================================
   NEW CHAT
========================================================= */

function startNewChat(){

    history = [];

    currentChatId = null;

    messages.innerHTML = "";

    welcome.style.display = "";

    input.value = "";

    resizeInput();

    closeSide();

    showToast("Chat baru dibuat.");

    setTimeout(() => input.focus(),100);

}

newChat.addEventListener(
    "click",
    startNewChat
);

newChatTop.addEventListener(
    "click",
    startNewChat
);


/* =========================================================
   COPY MESSAGE
========================================================= */

messages.addEventListener("click",async function(e){

    const copyBtn =
        e.target.closest(".copy-btn");

    if(copyBtn){

        const message =
            copyBtn
            .closest(".message")
            .querySelector(".message-text");

        const text =
            message.innerText || "";

        try{

            await navigator.clipboard.writeText(text);

            showToast("Jawaban disalin.");

        }catch{

            showToast("Gagal menyalin.");

        }

        return;

    }


    const regenBtn =
        e.target.closest(".regen-btn");

    if(regenBtn){

        if(busy) return;

        const all =
            [...messages.querySelectorAll(
                ".message.user .message-text"
            )];

        const last =
            all[all.length - 1];

        if(!last) return;

        sendMessage(last.innerText);

    }

});


/* =========================================================
   ATTACHMENT BUTTON
========================================================= */

attachBtn.addEventListener(
    "click",
    function(){

        fileInput.click();

    }
);

fileInput.addEventListener(
    "change",
    function(){

        if(this.files.length){

            showToast(
                this.files.length +
                " file dipilih."
            );

        }

    }
);


/* =========================================================
   LOCAL HISTORY
========================================================= */

function saveHistory(){

    try{

        localStorage.setItem(
            "oneAi_history",
            JSON.stringify(history)
        );

    }catch{}

}


function loadHistory(){

    try{

        const saved =
            localStorage.getItem(
                "oneAi_history"
            );

        if(saved){

            history = JSON.parse(saved);

        }

    }catch{

        history = [];

    }

}


/* =========================================================
   HISTORY LIST
========================================================= */

function renderHistory(){

    historyList.innerHTML = "";

    const users =
        history.filter(
            x => x.role === "user"
        );

    if(!users.length){

        historyList.innerHTML = `
            <div style="
                padding:10px;
                color:#4f545f;
                font-size:11px;
            ">
                Belum ada percakapan.
            </div>
        `;

        return;

    }

    users.slice(-20).reverse().forEach(item => {

        const button =
            document.createElement("button");

        button.type = "button";

        button.className =
            "history-item";

        button.textContent =
            item.content;

        button.addEventListener(
            "click",
            function(){

                input.value =
                    item.content;

                resizeInput();

                closeSide();

                input.focus();

            }
        );

        historyList.appendChild(button);

    });

}


/* =========================================================
   INIT
========================================================= */

loadHistory();

renderHistory();

resizeInput();


/* =========================================================
   DEBUG SAFETY
========================================================= */

window.addEventListener(
    "error",
    function(e){

        console.error(
            "oneAi error:",
            e.error || e.message
        );

    }
);

</script>

</body>
</html>
